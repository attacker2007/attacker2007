<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="240">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="border-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1f2937" stroke-width="0.75" stroke-opacity="0.6" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Fira Code', system-ui, -apple-system, monospace;
      font-weight: 800;
      font-size: 40px;
      letter-spacing: 2px;
      fill: url(#text-gradient);
    }
    .handle {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-weight: 600;
      font-size: 16px;
      fill: #38bdf8;
      letter-spacing: 1px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 17px;
      fill: #94a3b8;
      letter-spacing: 0.5px;
    }
    .tag {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 13px;
      fill: #cbd5e1;
    }
  </style>

  <!-- Background Card -->
  <rect width="1000" height="240" rx="16" fill="url(#bg-gradient)" />
  <rect width="1000" height="240" rx="16" fill="url(#grid)" />
  <rect width="998" height="238" x="1" y="1" rx="15" fill="none" stroke="url(#border-gradient)" stroke-width="1.5" />

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="50" r="80" fill="#38bdf8" fill-opacity="0.08" filter="url(#glow)" />
  <circle cx="850" cy="180" r="90" fill="#818cf8" fill-opacity="0.08" filter="url(#glow)" />

  <!-- Terminal Header Dots -->
  <circle cx="45" cy="35" r="6" fill="#ef4444" />
  <circle cx="65" cy="35" r="6" fill="#f59e0b" />
  <circle cx="85" cy="35" r="6" fill="#10b981" />
  <text x="110" y="39" class="handle">~/attacker2007</text>

  <!-- Main Content -->
  <g transform="translate(45, 90)">
    <text x="0" y="25" class="title">&gt; attacker2007</text>
    <text x="0" y="65" class="subtitle">Electrical &amp; Electronics Engineer &#8226; AI Programming &#8226; Systems Architecture</text>
    
    <!-- Code Badges -->
    <g transform="translate(0, 88)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="130" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="12" y="17" class="tag">&lt;AI Systems/&gt;</text>
      
      <!-- Badge 2 -->
      <rect x="140" y="0" width="155" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="152" y="17" class="tag">&lt;VHDL &amp; Silicon/&gt;</text>

      <!-- Badge 3 -->
      <rect x="305" y="0" width="150" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="317" y="17" class="tag">&lt;Web Platforms/&gt;</text>

      <!-- Badge 4 -->
      <rect x="465" y="0" width="170" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="477" y="17" class="tag">&lt;Quantum Research/&gt;</text>
    </g>
  </g>
</svg>
