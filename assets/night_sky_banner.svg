<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="320">
  <defs>
    <!-- Night Sky Gradient -->
    <linearGradient id="sky-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="40%" stop-color="#0b132b" />
      <stop offset="70%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>

    <!-- Nebula Glow Gradients -->
    <radialGradient id="nebula-blue" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#1e40af" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nebula-purple" cx="75%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <!-- Text Shimmer Gradient -->
    <linearGradient id="text-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>

    <!-- Handle Gradient -->
    <linearGradient id="handle-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="border-shimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.5" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="star-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .star { fill: #ffffff; }
    .star-dim { fill: #94a3b8; opacity: 0.6; }
    .star-bright { fill: #e0f2fe; filter: url(#star-glow); }
    .title {
      font-family: 'Fira Code', system-ui, -apple-system, monospace;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: 2px;
      fill: url(#handle-gradient);
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-weight: 400;
      font-size: 17px;
      fill: #cbd5e1;
      letter-spacing: 0.5px;
    }
    .tag {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 13px;
      fill: #e2e8f0;
    }
  </style>

  <!-- Sky Background -->
  <rect width="1200" height="320" rx="16" fill="url(#sky-gradient)" />
  <rect width="1200" height="320" rx="16" fill="url(#nebula-blue)" />
  <rect width="1200" height="320" rx="16" fill="url(#nebula-purple)" />

  <!-- Stars Field -->
  <!-- Bright Stars -->
  <circle cx="95" cy="45" r="2" class="star-bright" />
  <circle cx="180" cy="90" r="1.5" class="star" />
  <circle cx="260" cy="30" r="2.5" class="star-bright" />
  <circle cx="340" cy="80" r="1.2" class="star-dim" />
  <circle cx="420" cy="40" r="1.8" class="star" />
  <circle cx="510" cy="110" r="1.5" class="star-dim" />
  <circle cx="620" cy="35" r="2.2" class="star-bright" />
  <circle cx="700" cy="85" r="1.2" class="star" />
  <circle cx="790" cy="45" r="2.5" class="star-bright" />
  <circle cx="880" cy="100" r="1.5" class="star-dim" />
  <circle cx="970" cy="50" r="2" class="star-bright" />
  <circle cx="1060" cy="85" r="1.8" class="star" />
  <circle cx="1140" cy="35" r="2.2" class="star-bright" />

  <!-- Constellation Accent Lines -->
  <line x1="260" y1="30" x2="340" y2="80" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="0.75" stroke-dasharray="3,3" />
  <line x1="340" y1="80" x2="420" y2="40" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="0.75" stroke-dasharray="3,3" />
  <line x1="790" y1="45" x2="880" y2="100" stroke="#818cf8" stroke-opacity="0.3" stroke-width="0.75" stroke-dasharray="3,3" />
  <line x1="880" y1="100" x2="970" y2="50" stroke="#818cf8" stroke-opacity="0.3" stroke-width="0.75" stroke-dasharray="3,3" />

  <!-- Background Dense Star Dust -->
  <circle cx="60" cy="140" r="1" class="star-dim" />
  <circle cx="140" cy="180" r="0.8" class="star-dim" />
  <circle cx="210" cy="130" r="1.2" class="star" />
  <circle cx="310" cy="170" r="0.9" class="star-dim" />
  <circle cx="480" cy="150" r="1.1" class="star-dim" />
  <circle cx="580" cy="190" r="1.3" class="star" />
  <circle cx="660" cy="140" r="0.8" class="star-dim" />
  <circle cx="750" cy="165" r="1.4" class="star" />
  <circle cx="840" cy="140" r="1" class="star-dim" />
  <circle cx="920" cy="180" r="1.2" class="star" />
  <circle cx="1020" cy="150" r="0.8" class="star-dim" />
  <circle cx="1110" cy="160" r="1.1" class="star" />

  <!-- Distant Mountain Silhouettes (Night Landscape) -->
  <!-- Layer 1: Back Mountains -->
  <path d="M 0 320 L 0 250 Q 150 200 320 240 Q 480 280 650 220 Q 820 170 1000 230 Q 1120 270 1200 240 L 1200 320 Z" fill="#0f172a" fill-opacity="0.6" />
  
  <!-- Layer 2: Front Mountain Ridge -->
  <path d="M 0 320 L 0 275 Q 120 240 260 265 Q 420 295 580 250 Q 740 215 910 270 Q 1060 300 1200 265 L 1200 320 Z" fill="#020617" />

  <!-- Terminal Window Controls Top-Left -->
  <circle cx="50" cy="40" r="6" fill="#ef4444" opacity="0.85" />
  <circle cx="70" cy="40" r="6" fill="#f59e0b" opacity="0.85" />
  <circle cx="90" cy="40" r="6" fill="#10b981" opacity="0.85" />
  <text x="115" y="44" font-family="'Fira Code', monospace" font-size="14" fill="#38bdf8" opacity="0.9">~/attacker2007</text>

  <!-- Main Hero Content -->
  <g transform="translate(50, 105)">
    <text x="0" y="32" class="title">&gt; attacker2007</text>
    <text x="0" y="75" class="subtitle">Electrical &amp; Electronics Engineer &#8226; AI Programming &#8226; Systems Architecture</text>
    
    <!-- Tech Tags Overlay -->
    <g transform="translate(0, 105)">
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="12" y="19" class="tag">&lt;AI Systems/&gt;</text>
      
      <rect x="142" y="0" width="155" height="28" rx="6" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="154" y="19" class="tag">&lt;VHDL &amp; Silicon/&gt;</text>

      <rect x="309" y="0" width="150" height="28" rx="6" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="321" y="19" class="tag">&lt;Web Platforms/&gt;</text>

      <rect x="471" y="0" width="170" height="28" rx="6" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="483" y="19" class="tag">&lt;Quantum Research/&gt;</text>
    </g>
  </g>

  <!-- Sleek Border Frame -->
  <rect width="1198" height="318" x="1" y="1" rx="15" fill="none" stroke="url(#border-shimmer)" stroke-width="1.5" />
</svg>
